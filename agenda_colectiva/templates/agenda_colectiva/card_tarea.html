<div class="card mb-3 border-0 shadow-sm rounded-3">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-dark text-white fw-mono fs-8">{{ item.id_compromiso }}</span>
            <span class="text-muted fs-8">{{ item.fecha_compromiso }}</span>
        </div>
        <h6 class="fw-bold mb-1">{{ item.vecino_solicitante }}</h6>
        <p class="text-secondary small mb-2" style="font-size: 0.85rem;">
            {{ item.descripcion }}
        </p>
        <div class="border-top pt-2 mt-2">
            <p class="mb-2 text-dark small"><strong>Asignado:</strong> {{ item.responsable_nombre }}</p>

            <!-- Selector para mover la tarea (simulacion de post estilo Jira) -->
            <form method="POST" action="{% url 'mover_compromiso' %}" class="d-flex gap-1 align-items-center">
                {% csrf_token %}
                <input type="hidden" name="id_compromiso" value="{{ item.id_compromiso }}">
                <select name="nuevo_estado" class="form-select form-select-sm" onchange="this.form.submit()" style="font-size: 0.75rem;">
                    <option value="Ingresado" {% if item.estado == "Ingresado" %}selected{% endif %}>Ingresar</option>
                    <option value="Pendiente" {% if item.estado == "Pendiente" %}selected{% endif %}>Suspender</option>
                    <option value="En Proceso" {% if item.estado == "En Proceso" %}selected{% endif %}>Procesar</option>
                    <option value="Realizado" {% if item.estado == "Realizado" %}selected{% endif %}>Completar</option>
                </select>
            </form>
        </div>
    </div>
</div>
