<div class="card mb-2 shadow-sm">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between mb-1">
            <span class="badge bg-dark">COMP-{{ task.id }}</span>
            <span class="text-muted small fw-bold">{{ task.territorio }}</span>
        </div>
        <h6 class="card-title fw-bold mb-1">{{ task.vecino }}</h6>
        <p class="card-text text-muted small mb-2" style="font-size: 0.85rem;">{{ task.descripcion }}</p>

        <div class="border-top pt-2 mt-2" style="font-size: 0.8rem;">
            <div><strong>Contacto:</strong> {{ task.telefono }}</div>
            <div><strong>Asignado:</strong> {{ task.responsable_nombre }}</div>
            <div class="text-danger"><strong>Límite:</strong> {{ task.fecha_compromiso }}</div>
        </div>

        <!-- Acciones Rápidas (CRUD) -->
        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <form action="{% url 'cambiar_estado' task.id %}" method="POST" class="d-inline-block">
                {% csrf_token %}
                <select name="estado" class="form-select form-select-sm" style="width: auto; font-size: 0.75rem;" onchange="this.form.submit()">
                    <option value="Ingresado" {% if task.estado == 'Ingresado' %}selected{% endif %}>Mover a Ingresado</option>
                    <option value="Pendiente" {% if task.estado == 'Pendiente' %}selected{% endif %}>Mover a Pendiente</option>
                    <option value="En Proceso" {% if task.estado == 'En Proceso' %}selected{% endif %}>Mover a En Proceso</option>
                    <option value="Realizado" {% if task.estado == 'Realizado' %}selected{% endif %}>Mover a Realizado</option>
                </select>
            </form>
            <div>
                <a href="{% url 'editar_compromiso' task.id %}" class="btn btn-link btn-sm p-0 me-2 text-decoration-none" title="Editar">Editar</a>
                <a href="{% url 'eliminar_compromiso' task.id %}" class="btn btn-link btn-sm p-0 text-danger text-decoration-none" onclick="return confirm('¿Seguro que deseas eliminar este compromiso?')" title="Eliminar">Eliminar</a>
            </div>
        </div>
    </div>
</div>
